[tool.poetry]
name = "rhm-workers"
version = "0.1.0"
description = "Rabbit Hole Mapper — Celery Workers"

[tool.poetry.dependencies]
python = "^3.12"
celery = {extras = ["redis"], version = "^5.4"}
kombu = "^5.3"
pydantic = "^2.7"
pydantic-settings = "^2.3"
sqlalchemy = {extras = ["asyncio"], version = "^2.0"}
asyncpg = "^0.29"
neo4j = "^5.20"
qdrant-client = "^1.9"
anthropic = "^0.28"
openai = "^1.30"
voyageai = "^0.2"
spacy = "^3.7"
trafilatura = "^1.9"
playwright = "^1.44"
praw = "^7.7"
youtube-transcript-api = "^0.6"
google-api-python-client = "^2.132"
arxiv = "^2.1"
protego = "^0.3"
boto3 = "^1.34"
httpx = "^0.27"
structlog = "^24.1"
langfuse = "^2.28"
tenacity = "^8.3"
sentry-sdk = "^2.5"
opentelemetry-api = "^1.24"

[tool.poetry.dev-dependencies]
pytest = "^8.2"
pytest-asyncio = "^0.23"
testcontainers = {extras = ["postgresql", "neo4j", "redis"], version = "^4.5"}
ruff = "^0.4"
mypy = "^1.10"
