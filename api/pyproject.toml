[tool.poetry]
name = "rhm-api"
version = "0.1.0"
description = "Rabbit Hole Mapper — API Gateway"

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "^0.111"
uvicorn = {extras = ["standard"], version = "^0.30"}
pydantic = "^2.7"
pydantic-settings = "^2.3"
sqlalchemy = {extras = ["asyncio"], version = "^2.0"}
asyncpg = "^0.29"
alembic = "^1.13"
redis = {extras = ["hiredis"], version = "^5.0"}
httpx = "^0.27"
python-jose = {extras = ["cryptography"], version = "^3.3"}
httpx-clerk = "^0.1"
sentry-sdk = {extras = ["fastapi"], version = "^2.5"}
opentelemetry-api = "^1.24"
opentelemetry-sdk = "^1.24"
opentelemetry-instrumentation-fastapi = "^0.45b0"
opentelemetry-exporter-otlp = "^1.24"
structlog = "^24.1"
celery = {extras = ["redis"], version = "^5.4"}

[tool.poetry.dev-dependencies]
pytest = "^8.2"
pytest-asyncio = "^0.23"
pytest-env = "^1.1"
httpx = "^0.27"
factory-boy = "^3.3"
testcontainers = {extras = ["postgresql", "neo4j", "redis"], version = "^4.5"}
ruff = "^0.4"
mypy = "^1.10"
