version: "3.9"

services:
  # ─── Databases ───────────────────────────────────────────────────────────────

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: rhm
      POSTGRES_PASSWORD: rhm
      POSTGRES_DB: rabbithole
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rhm -d rabbithole"]
      interval: 5s
      timeout: 5s
      retries: 10

  neo4j:
    image: neo4j:5.20-community
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/rabbitholepass
      NEO4J_PLUGINS: '["apoc", "graph-data-science"]'
      NEO4J_dbms_security_procedures_unrestricted: "apoc.*,gds.*"
      NEO4J_dbms_security_procedures_allowlist: "apoc.*,gds.*"
      NEO4J_server_memory_heap_initial__size: "512m"
      NEO4J_server_memory_heap_max__size: "1G"
    ports:
      - "7474:7474"  # browser
      - "7687:7687"  # bolt
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "wget -O /dev/null -q http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  qdrant:
    image: qdrant/qdrant:v1.9.4
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:6333/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9000/minio/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ─── API Gateway ─────────────────────────────────────────────────────────────

  api:
    build:
      # Build context is repo root so Dockerfile can COPY packages/
      context: ../..
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    env_file:
      - ../../.env
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    volumes:
      - ../../apps/api:/app
      - ../../packages:/packages
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  # ─── Celery Workers ──────────────────────────────────────────────────────────

  worker-crawler:
    build:
      context: ../..
      dockerfile: apps/workers/Dockerfile
    restart: unless-stopped
    env_file:
      - ../../.env
    command: celery -A workers.celery_app worker -Q crawl -c 4 --loglevel=info
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    volumes:
      - ../../apps/workers:/app
      - ../../packages:/packages

  worker-extraction:
    build:
      context: ../..
      dockerfile: apps/workers/Dockerfile
    restart: unless-stopped
    env_file:
      - ../../.env
    command: celery -A workers.celery_app worker -Q extraction -c 2 --loglevel=info
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    volumes:
      - ../../apps/workers:/app
      - ../../packages:/packages

  worker-contradiction:
    build:
      context: ../..
      dockerfile: apps/workers/Dockerfile
    restart: unless-stopped
    env_file:
      - ../../.env
    command: celery -A workers.celery_app worker -Q contradiction -c 2 --loglevel=info
    depends_on:
      redis:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    volumes:
      - ../../apps/workers:/app
      - ../../packages:/packages

  celery-beat:
    build:
      context: ../..
      dockerfile: apps/workers/Dockerfile
    restart: unless-stopped
    env_file:
      - ../../.env
    command: celery -A workers.celery_app beat --loglevel=info
    depends_on:
      redis:
        condition: service_healthy

  flower:
    image: mher/flower:2.0
    restart: unless-stopped
    environment:
      CELERY_BROKER_URL: redis://redis:6379/1
    ports:
      - "5555:5555"
    depends_on:
      - redis

  # ─── Frontend ────────────────────────────────────────────────────────────────

  web:
    build:
      context: ../../apps/web
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    env_file:
      - ../../.env
    ports:
      - "3000:3000"
    volumes:
      - ../../apps/web:/app
      - /app/node_modules
    command: npm run dev

volumes:
  postgres_data:
  neo4j_data:
  neo4j_logs:
  redis_data:
  qdrant_data:
  minio_data:
